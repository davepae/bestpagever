<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AETHERIUM — Interactive Light &amp; Gravity Observatory</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --glass-bg: rgba(10, 12, 20, 0.46);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.22);
    --text-primary: rgba(248, 250, 255, 0.94);
    --text-secondary: rgba(210, 218, 235, 0.62);
    --accent: #f6b868;
    --accent-glow: rgba(246, 184, 104, 0.35);
    --radius-pill: 999px;
    --radius-card: 20px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, sans-serif;
    --font-serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04050a;
    color: var(--text-primary);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    touch-action: none;
  }

  /* Canvas layers */
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #glCanvas {
    z-index: 1;
  }

  #fxCanvas {
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  /* Subtle vignette & film grain */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 52%, rgba(2, 3, 8, 0.58) 100%);
  }

  /* Top Editorial Header */
  .topbar {
    position: fixed;
    top: 24px;
    left: 28px;
    right: 28px;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
    transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
    pointer-events: auto;
  }

  .brand-title {
    font-family: var(--font-serif);
    font-size: clamp(1.15rem, 2vw, 1.55rem);
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-primary);
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent), 0 0 24px var(--accent-glow);
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }

  .brand-sub {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-secondary);
    padding-left: 17px;
  }

  .telemetry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    pointer-events: auto;
  }

  .telemetry span strong {
    color: var(--text-primary);
    font-weight: 500;
  }

  .sep {
    width: 1px;
    height: 11px;
    background: rgba(255, 255, 255, 0.14);
  }

  /* Center Gesture Hint (fades away after first interaction) */
  .hint {
    position: fixed;
    left: 50%;
    bottom: 104px;
    transform: translateX(-50%);
    z-index: 9;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    background: rgba(8, 10, 18, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 0.74rem;
    letter-spacing: 0.08em;
    color: rgba(235, 240, 255, 0.72);
    pointer-events: none;
    transition: opacity 1s ease, transform 1s ease;
    white-space: nowrap;
  }

  .hint.hidden {
    opacity: 0;
    transform: translate(-50%, 10px);
  }

  /* Floating Control Dock */
  .dock-wrap {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 12;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .dock {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-radius: var(--radius-pill);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(24px) saturate(165%);
    -webkit-backdrop-filter: blur(24px) saturate(165%);
  }

  .world-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px;
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.04);
  }

  .btn {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: 0.76rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    white-space: nowrap;
  }

  .btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.08);
  }

  .btn.active {
    color: #08090f;
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
    font-weight: 600;
  }

  .btn-icon {
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(255, 255, 255, 0.03);
  }

  .btn-icon.on {
    color: var(--text-primary);
    border-color: var(--glass-highlight);
    background: rgba(255, 255, 255, 0.12);
  }

  .btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .dock-divider {
    width: 1px;
    height: 20px;
    background: rgba(255, 255, 255, 0.12);
    margin: 0 3px;
  }

  /* Expandable Fine-Tune Panel */
  .panel {
    width: min(460px, calc(100vw - 32px));
    padding: 18px 20px;
    border-radius: var(--radius-card);
    background: rgba(10, 12, 22, 0.68);
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 20px;
    opacity: 0;
    transform: translateY(12px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .slider-head {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .slider-head output {
    font-family: var(--font-mono);
    color: var(--text-primary);
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.14);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #090b12;
    box-shadow: 0 0 12px var(--accent-glow);
    transition: transform 0.15s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.18);
  }

  /* Zen mode hides chrome */
  body.zen .topbar,
  body.zen .dock-wrap,
  body.zen .hint {
    opacity: 0;
    pointer-events: none;
  }

  body.zen .topbar {
    transform: translateY(-14px);
  }

  body.zen .dock-wrap {
    transform: translate(-50%, 18px);
  }

  /* Toast notification */
  .toast {
    position: fixed;
    top: 26px;
    left: 50%;
    transform: translate(-50%, -14px);
    z-index: 20;
    padding: 9px 18px;
    border-radius: var(--radius-pill);
    background: rgba(14, 18, 30, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(18px);
    font-size: 0.76rem;
    letter-spacing: 0.06em;
    color: var(--text-primary);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (max-width: 720px) {
    .topbar {
      top: 14px;
      left: 16px;
      right: 16px;
    }
    .telemetry {
      display: none;
    }
    .dock {
      flex-wrap: wrap;
      justify-content: center;
      border-radius: 22px;
      max-width: calc(100vw - 24px);
    }
    .dock-divider {
      display: none;
    }
    .panel {
      grid-template-columns: 1fr;
    }
    .hint {
      bottom: 132px;
      font-size: 0.68rem;
    }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="glCanvas"></canvas>
    <canvas id="fxCanvas"></canvas>
  </div>
  <div class="vignette"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-title"><span class="brand-dot" id="brandDot"></span>AETHERIUM</div>
      <div class="brand-sub" id="worldDesc">Solaris &mdash; Accretion Corona &amp; Gravitational Light</div>
    </div>
    <div class="telemetry">
      <span>FPS <strong id="fpsVal">60</strong></span>
      <span class="sep"></span>
      <span>PARTICLES <strong id="partVal">320</strong></span>
      <span class="sep"></span>
      <span>KEY <strong>H</strong> ZEN</span>
    </div>
  </header>

  <div class="hint" id="hint">Move to bend light &middot; Hold click to form a singularity &middot; Release for shockwave &middot; Scroll to zoom</div>

  <div class="toast" id="toast"></div>

  <div class="dock-wrap">
    <div class="panel" id="panel">
      <div class="slider-row">
        <div class="slider-head"><span>Flow Velocity</span><output id="outSpeed">1.00</output></div>
        <input id="rngSpeed" type="range" min="0.15" max="2.5" step="0.05" value="1.0" />
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>Luminance</span><output id="outGlow">1.10</output></div>
        <input id="rngGlow" type="range" min="0.5" max="1.8" step="0.05" value="1.1" />
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>Gravity Pull</span><output id="outGravity">1.00</output></div>
        <input id="rngGravity" type="range" min="0.2" max="2.4" step="0.05" value="1.0" />
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>Starfield Density</span><output id="outParticles">320</output></div>
        <input id="rngParticles" type="range" min="80" max="600" step="20" value="320" />
      </div>
    </div>

    <nav class="dock" aria-label="Controls">
      <div class="world-group" role="tablist">
        <button class="btn active" data-world="0" title="Key 1">Solaris</button>
        <button class="btn" data-world="1" title="Key 2">Abyssal</button>
        <button class="btn" data-world="2" title="Key 3">Aether</button>
        <button class="btn" data-world="3" title="Key 4">Prism</button>
      </div>

      <span class="dock-divider"></span>

      <button class="btn btn-icon" id="btnSound" title="Toggle generative ambient audio (M)">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path id="soundWaves" d="M15.5 8.5a5 5 0 0 1 0 7M18.8 5.2a9.5 9.5 0 0 1 0 13.6" opacity="0.35"/></svg>
        <span>Sound</span>
      </button>

      <button class="btn btn-icon" id="btnPause" title="Pause / Resume (Space)">
        <svg viewBox="0 0 24 24" id="iconPause"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>

      <button class="btn btn-icon" id="btnTune" title="Fine-tune parameters">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>

      <button class="btn btn-icon" id="btnSnap" title="Save high-res PNG snapshot (S)">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </nav>
  </div>

<script>
(() => {
  'use strict';

  /* =========================================================================
     WORLD PRESETS
     ========================================================================= */
  const WORLDS = [
    {
      name: 'Solaris',
      desc: 'Solaris \u2014 Accretion Corona & Gravitational Light',
      accent: '#f6b868',
      accentGlow: 'rgba(246, 184, 104, 0.4)',
      c1: [0.02, 0.015, 0.035],
      c2: [0.62, 0.16, 0.05],
      c3: [1.00, 0.62, 0.22],
      c4: [1.00, 0.94, 0.80],
      particlePalette: ['#ffd89b', '#ff9d52', '#fff3d6', '#ff6f47'],
      chord: [130.81, 196.00, 246.94, 293.66, 392.00] // Cmaj9
    },
    {
      name: 'Abyssal',
      desc: 'Abyssal \u2014 Bioluminescent Caustics & Deep Cosmos',
      accent: '#4de8e8',
      accentGlow: 'rgba(77, 232, 232, 0.38)',
      c1: [0.01, 0.02, 0.06],
      c2: [0.04, 0.26, 0.56],
      c3: [0.12, 0.82, 0.88],
      c4: [0.82, 0.42, 1.00],
      particlePalette: ['#5ef2f2', '#4a90ff', '#d682ff', '#c2ffff'],
      chord: [110.00, 164.81, 220.00, 261.63, 329.63] // Am9
    },
    {
      name: 'Aether',
      desc: 'Aether \u2014 Borealis Curtains & Emerald Veil',
      accent: '#5df2a8',
      accentGlow: 'rgba(93, 242, 168, 0.38)',
      c1: [0.015, 0.03, 0.045],
      c2: [0.06, 0.42, 0.38],
      c3: [0.22, 0.94, 0.62],
      c4: [0.58, 0.42, 1.00],
      particlePalette: ['#6dffb8', '#42d9ff', '#b28cff', '#d9ffed'],
      chord: [146.83, 220.00, 277.18, 329.63, 440.00] // Dmaj9
    },
    {
      name: 'Prism',
      desc: 'Prism \u2014 Opalescent Liquid Silk & Spectral Dispersion',
      accent: '#f09cff',
      accentGlow: 'rgba(240, 156, 255, 0.4)',
      c1: [0.03, 0.02, 0.06],
      c2: [0.46, 0.14, 0.58],
      c3: [0.95, 0.44, 0.78],
      c4: [0.68, 0.95, 1.00],
      particlePalette: ['#ff9ee5', '#9ceeff', '#ffe49e', '#ffffff'],
      chord: [174.61, 220.00, 261.63, 329.63, 392.00] // Fmaj9
    }
  ];

  /* =========================================================================
     STATE
     ========================================================================= */
  const state = {
    worldIndex: 0,
    paused: false,
    time: 0,
    speed: 1.0,
    glow: 1.1,
    gravity: 1.0,
    particleTarget: 320,
    zoom: 1.0,
    targetZoom: 1.0,
    // Pointer in normalized [0..1]
    mx: 0.5,
    my: 0.5,
    tx: 0.5,
    ty: 0.5,
    vx: 0,
    vy: 0,
    pressing: false,
    pressCharge: 0,
    shockwave: 0,
    shockX: 0.5,
    shockY: 0.5,
    interacted: false,
    // Smoothly interpolated palette colors
    c1: [...WORLDS[0].c1],
    c2: [...WORLDS[0].c2],
    c3: [...WORLDS[0].c3],
    c4: [...WORLDS[0].c4],
    modeBlend: 0
  };

  /* =========================================================================
     DOM ELEMENTS
     ========================================================================= */
  const glCanvas = document.getElementById('glCanvas');
  const fxCanvas = document.getElementById('fxCanvas');
  const fxCtx = fxCanvas.getContext('2d');
  const stage = document.getElementById('stage');
  const brandDot = document.getElementById('brandDot');
  const worldDesc = document.getElementById('worldDesc');
  const fpsVal = document.getElementById('fpsVal');
  const partVal = document.getElementById('partVal');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');
  const panel = document.getElementById('panel');

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /* =========================================================================
     WEBGL2 VOLUMETRIC FLUID & GRAVITATIONAL LENSING SHADER
     ========================================================================= */
  const gl = glCanvas.getContext('webgl2', {
    antialias: false,
    alpha: false,
    preserveDrawingBuffer: true,
    powerPreference: 'high-performance'
  });

  let program = null;
  let uniforms = {};
  let hasWebGL = false;

  const VERT_SRC = `#version 300 es
  precision highp float;
  const vec2 verts[3] = vec2[3](
    vec2(-1.0, -1.0),
    vec2( 3.0, -1.0),
    vec2(-1.0,  3.0)
  );
  void main() {
    gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0);
  }`;

  const FRAG_SRC = `#version 300 es
  precision highp float;

  uniform vec2 u_res;
  uniform float u_time;
  uniform vec2 u_mouse;
  uniform float u_charge;
  uniform float u_shock;
  uniform vec2 u_shockPos;
  uniform float u_glow;
  uniform float u_zoom;
  uniform float u_mode;
  uniform vec3 u_c1;
  uniform vec3 u_c2;
  uniform vec3 u_c3;
  uniform vec3 u_c4;

  out vec4 fragColor;

  mat2 rot(float a) {
    float s = sin(a), c = cos(a);
    return mat2(c, -s, s, c);
  }

  float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }

  float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.52;
    mat2 m = mat2(0.80, -0.60, 0.60, 0.80);
    for (int i = 0; i < 6; i++) {
      v += a * noise(p);
      p = m * p * 2.03 + vec2(1.7, 9.2);
      a *= 0.5;
    }
    return v;
  }

  // Deep starfield layer
  float stars(vec2 uv, float scale, float density) {
    vec2 gv = fract(uv * scale) - 0.5;
    vec2 id = floor(uv * scale);
    float n = hash(id);
    if (n < density) return 0.0;
    vec2 offs = vec2(hash(id + 13.7), hash(id + 71.3)) - 0.5;
    float d = length(gv - offs * 0.72);
    float twinkle = 0.65 + 0.35 * sin(u_time * (1.5 + n * 4.0) + n * 62.8);
    float core = smoothstep(0.055, 0.0, d);
    return core * twinkle * (n - density) / (1.0 - density);
  }

  void main() {
    vec2 frag = gl_FragCoord.xy;
    vec2 uv = (frag - 0.5 * u_res) / min(u_res.x, u_res.y);
    uv /= u_zoom;

    vec2 m = (u_mouse * u_res - 0.5 * u_res) / min(u_res.x, u_res.y);
    m /= u_zoom;

    vec2 sp = (u_shockPos * u_res - 0.5 * u_res) / min(u_res.x, u_res.y);
    sp /= u_zoom;

    // Gravitational lensing around cursor
    vec2 toM = uv - m;
    float distM = length(toM) + 0.0001;
    float lensStrength = (0.045 + u_charge * 0.19) / (distM * distM + 0.09);
    vec2 lensedUV = uv - normalize(toM) * lensStrength * 0.16;
    // Swirl when charging singularity
    float swirlAngle = u_charge * 1.45 * exp(-distM * 2.4);
    lensedUV = m + rot(swirlAngle) * (lensedUV - m);

    // Expanding shockwave ring displacement
    vec2 toS = lensedUV - sp;
    float distS = length(toS) + 0.0001;
    float waveRadius = (1.0 - u_shock) * 1.65;
    float ringBand = exp(-pow((distS - waveRadius) * 11.0, 2.0)) * u_shock;
    lensedUV += normalize(toS) * ringBand * 0.075;

    float t = u_time * 0.24;

    // Dual-stage domain-warped FBM for volumetric silk / nebula / corona
    vec2 p = lensedUV * 1.45;
    float radial = length(lensedUV);

    // Subtle orbital rotation
    p = rot(t * 0.18 + 0.28 / (radial + 0.45)) * p;

    vec2 q = vec2(
      fbm(p + vec2(t * 0.55, -t * 0.32)),
      fbm(p + vec2(-t * 0.42 + 4.3, t * 0.51 + 1.9))
    );

    vec2 r = vec2(
      fbm(p + 2.6 * q + vec2(1.7, 9.2) + t * 0.35),
      fbm(p + 2.6 * q + vec2(8.3, 2.8) - t * 0.28)
    );

    float f = fbm(p + 2.2 * r);

    // Sculpted filaments & caustics
    float ridge = 1.0 - abs(2.0 * f - 1.0);
    ridge = pow(clamp(ridge, 0.0, 1.0), 2.4);

    // Luminous central accretion halo
    float coreHalo = exp(-radial * 2.15) * (0.45 + 0.55 * f);
    float coronaRing = exp(-pow((radial - 0.38 - 0.06 * sin(t * 1.7 + q.x * 4.0)) * 4.5, 2.0));

    // Chromatic iridescence shimmer
    float irid = 0.5 + 0.5 * sin(6.2831 * (f * 1.3 + r.x * 0.8 + t * 0.35));

    // Blend palette smoothly
    vec3 col = mix(u_c1, u_c2, smoothstep(0.14, 0.72, f));
    col = mix(col, u_c3, smoothstep(0.32, 0.92, length(q) * 0.88 + ridge * 0.45));
    col = mix(col, u_c4, smoothstep(0.58, 1.05, ridge * 0.95 + coronaRing * 0.55 + irid * 0.22));

    // Add radiant core & luminous filaments
    col += u_c3 * coreHalo * 0.72;
    col += u_c4 * pow(ridge, 3.2) * 0.58;
    col += mix(u_c3, u_c4, 0.65) * coronaRing * (0.28 + 0.35 * ridge);

    // Singularity event horizon + photon ring when holding click
    float photonRing = exp(-pow((distM - (0.095 + 0.035 * u_charge)) * 28.0, 2.0)) * (0.22 + u_charge * 1.55);
    float eventHorizon = smoothstep(0.085 * u_charge, 0.02 * u_charge, distM) * u_charge;
    col = mix(col, vec3(0.01, 0.01, 0.02), eventHorizon * 0.94);
    col += mix(u_c3, u_c4, 0.75) * photonRing;

    // Cursor soft aura
    float cursorGlow = exp(-distM * 5.2) * (0.14 + u_charge * 0.28);
    col += mix(u_c3, u_c4, 0.5) * cursorGlow;

    // Shockwave luminous crest
    col += mix(u_c4, vec3(1.0), 0.5) * ringBand * 0.95;

    // Deep multi-layer starfield
    float s1 = stars(lensedUV + vec2(t * 0.015, -t * 0.01), 18.0, 0.965);
    float s2 = stars(lensedUV * 1.3 - vec2(t * 0.008, t * 0.012), 34.0, 0.978);
    col += mix(vec3(0.85, 0.92, 1.0), u_c4, 0.35) * (s1 * 0.85 + s2 * 0.55);

    // Apply luminance & ACES-inspired filmic tone mapping
    col *= u_glow;
    col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);
    col = pow(clamp(col, 0.0, 1.0), vec3(0.95));

    fragColor = vec4(col, 1.0);
  }`;

  function compileShader(type, source) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  if (gl) {
    const vs = compileShader(gl.VERTEX_SHADER, VERT_SRC);
    const fs = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
    if (vs && fs) {
      program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
        hasWebGL = true;
        gl.useProgram(program);
        const names = [
          'u_res', 'u_time', 'u_mouse', 'u_charge', 'u_shock', 'u_shockPos',
          'u_glow', 'u_zoom', 'u_mode', 'u_c1', 'u_c2', 'u_c3', 'u_c4'
        ];
        for (const n of names) {
          uniforms[n] = gl.getUniformLocation(program, n);
        }
      } else {
        console.error('Program link error:', gl.getProgramInfoLog(program));
      }
    }
  }

  /* =========================================================================
     INTERACTIVE LUMINOUS PARTICLE & CONSTELLATION OVERLAY (2D CANVAS)
     ========================================================================= */
  let width = 1, height = 1, dpr = 1;
  const particles = [];
  const ripples = [];

  function randomPaletteColor() {
    const pal = WORLDS[state.worldIndex].particlePalette;
    return pal[(Math.random() * pal.length) | 0];
  }

  function createParticle(burstX, burstY, isBurst = false) {
    const angle = Math.random() * Math.PI * 2;
    const speed = isBurst ? (2.2 + Math.random() * 6.5) : (0.15 + Math.random() * 0.65);
    return {
      x: isBurst ? burstX : Math.random() * width,
      y: isBurst ? burstY : Math.random() * height,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: isBurst ? (1.4 + Math.random() * 2.4) : (0.8 + Math.random() * 2.1),
      alpha: isBurst ? 1.0 : (0.25 + Math.random() * 0.65),
      life: isBurst ? (0.85 + Math.random() * 0.5) : 999,
      maxLife: 1.35,
      isBurst,
      color: randomPaletteColor(),
      phase: Math.random() * Math.PI * 2
    };
  }

  function syncParticleCount() {
    const ambient = particles.filter(p => !p.isBurst);
    const diff = state.particleTarget - ambient.length;
    if (diff > 0) {
      for (let i = 0; i < diff; i++) particles.push(createParticle());
    } else if (diff < 0) {
      let toRemove = -diff;
      for (let i = particles.length - 1; i >= 0 && toRemove > 0; i--) {
        if (!particles[i].isBurst) {
          particles.splice(i, 1);
          toRemove--;
        }
      }
    }
    partVal.textContent = String(state.particleTarget);
  }

  function spawnShockwave(nx, ny, strength) {
    const px = nx * width;
    const py = ny * height;
    ripples.push({
      x: px,
      y: py,
      radius: 12,
      maxRadius: Math.min(width, height) * (0.42 + strength * 0.35),
      alpha: 0.85,
      color: WORLDS[state.worldIndex].accent
    });
    const burstCount = Math.floor(26 + strength * 42);
    for (let i = 0; i < burstCount; i++) {
      particles.push(createParticle(px, py, true));
    }
    // Kick nearby ambient particles outward
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.isBurst) continue;
      const dx = p.x - px;
      const dy = p.y - py;
      const d = Math.hypot(dx, dy) + 1;
      if (d < 360) {
        const force = (1 - d / 360) * (5 + strength * 9);
        p.vx += (dx / d) * force;
        p.vy += (dy / d) * force;
      }
    }
  }

  /* =========================================================================
     GENERATIVE WEB AUDIO AMBIENT SYNTHESIZER (ZERO EXTERNAL FILES)
     ========================================================================= */
  const audio = {
    ctx: null,
    master: null,
    filter: null,
    oscillators: [],
    enabled: false,
    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();

      this.master = this.ctx.createGain();
      this.master.gain.value = 0.0001;

      this.filter = this.ctx.createBiquadFilter();
      this.filter.type = 'lowpass';
      this.filter.frequency.value = 680;
      this.filter.Q.value = 1.4;

      // Subtle stereo delay shimmer
      const delayL = this.ctx.createDelay(1.0);
      const delayR = this.ctx.createDelay(1.0);
      delayL.delayTime.value = 0.37;
      delayR.delayTime.value = 0.53;
      const fbL = this.ctx.createGain();
      const fbR = this.ctx.createGain();
      fbL.gain.value = 0.32;
      fbR.gain.value = 0.32;
      const wet = this.ctx.createGain();
      wet.gain.value = 0.28;

      this.filter.connect(this.master);
      this.filter.connect(delayL);
      this.filter.connect(delayR);
      delayL.connect(fbL); fbL.connect(delayR);
      delayR.connect(fbR); fbR.connect(delayL);
      delayL.connect(wet);
      delayR.connect(wet);
      wet.connect(this.master);
      this.master.connect(this.ctx.destination);

      // Build warm 5-voice detuned ambient pad
      const chord = WORLDS[state.worldIndex].chord;
      chord.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.value = freq;
        osc.detune.value = (i - 2) * 4.5;
        g.gain.value = i === 0 ? 0.16 : 0.085;
        osc.connect(g);
        g.connect(this.filter);
        osc.start();
        this.oscillators.push({ osc, g });
      });
    },
    toggle() {
      this.init();
      if (!this.ctx) {
        showToast('Web Audio unavailable in this browser');
        return;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.enabled = !this.enabled;
      const now = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setTargetAtTime(this.enabled ? 0.32 : 0.0001, now, 0.45);
      document.getElementById('btnSound').classList.toggle('on', this.enabled);
      document.getElementById('soundWaves').setAttribute('opacity', this.enabled ? '1' : '0.35');
      showToast(this.enabled ? 'Ambient Soundscape On' : 'Ambient Soundscape Muted');
    },
    setChord(chord) {
      if (!this.ctx || !this.oscillators.length) return;
      const now = this.ctx.currentTime;
      this.oscillators.forEach((v, i) => {
        const targetFreq = chord[i % chord.length];
        v.osc.frequency.setTargetAtTime(targetFreq, now, 0.9);
      });
    },
    updateModulation(charge, mx, my) {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const cutoff = 420 + (1.0 - my) * 950 + charge * 1400;
      this.filter.frequency.setTargetAtTime(cutoff, now, 0.12);
    },
    triggerChime(strength) {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const chord = WORLDS[state.worldIndex].chord;
      const base = chord[(Math.random() * chord.length) | 0] * 2;
      const osc = this.ctx.createOscillator();
      const env = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base, now);
      osc.frequency.exponentialRampToValueAtTime(base * 1.004, now + 1.8);
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(0.14 + strength * 0.14, now + 0.03);
      env.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
      osc.connect(env);
      env.connect(this.filter);
      osc.start(now);
      osc.stop(now + 2.5);
    }
  };

  /* =========================================================================
     RESIZE HANDLING
     ========================================================================= */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    glCanvas.width = Math.floor(width * dpr);
    glCanvas.height = Math.floor(height * dpr);
    if (hasWebGL) {
      gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    }

    fxCanvas.width = Math.floor(width * dpr);
    fxCanvas.height = Math.floor(height * dpr);
    fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();
  syncParticleCount();

  /* =========================================================================
     WORLD SWITCHING & UI WIRING
     ========================================================================= */
  function setWorld(idx) {
    state.worldIndex = ((idx % WORLDS.length) + WORLDS.length) % WORLDS.length;
    const w = WORLDS[state.worldIndex];
    document.documentElement.style.setProperty('--accent', w.accent);
    document.documentElement.style.setProperty('--accent-glow', w.accentGlow);
    worldDesc.textContent = w.desc;
    document.querySelectorAll('[data-world]').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.world) === state.worldIndex);
    });
    // Gently recolor ambient particles
    for (let i = 0; i < particles.length; i++) {
      if (!particles[i].isBurst && Math.random() < 0.75) {
        particles[i].color = randomPaletteColor();
      }
    }
    audio.setChord(w.chord);
  }

  document.querySelectorAll('[data-world]').forEach(btn => {
    btn.addEventListener('click', () => setWorld(Number(btn.dataset.world)));
  });

  document.getElementById('btnSound').addEventListener('click', () => audio.toggle());

  const btnPause = document.getElementById('btnPause');
  function togglePause() {
    state.paused = !state.paused;
    btnPause.classList.toggle('on', state.paused);
    document.getElementById('iconPause').innerHTML = state.paused
      ? '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/>'
      : '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    showToast(state.paused ? 'Simulation Paused' : 'Simulation Resumed');
  }
  btnPause.addEventListener('click', togglePause);

  const btnTune = document.getElementById('btnTune');
  btnTune.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    btnTune.classList.toggle('on', open);
  });

  // Snapshot compositor (merges WebGL2 + 2D particle layer into one crisp PNG)
  function captureSnapshot() {
    const out = document.createElement('canvas');
    out.width = glCanvas.width;
    out.height = glCanvas.height;
    const octx = out.getContext('2d');
    octx.drawImage(glCanvas, 0, 0);
    octx.globalCompositeOperation = 'screen';
    octx.drawImage(fxCanvas, 0, 0);
    const link = document.createElement('a');
    const name = WORLDS[state.worldIndex].name.toLowerCase();
    link.download = `aetherium-${name}-${Date.now()}.png`;
    link.href = out.toDataURL('image/png');
    link.click();
    showToast('Saved PNG Snapshot');
  }
  document.getElementById('btnSnap').addEventListener('click', captureSnapshot);

  // Sliders
  const bindSlider = (id, outId, key, fmt, onChange) => {
    const el = document.getElementById(id);
    const out = document.getElementById(outId);
    el.addEventListener('input', () => {
      const v = Number(el.value);
      state[key] = v;
      out.textContent = fmt(v);
      if (onChange) onChange(v);
    });
  };
  bindSlider('rngSpeed', 'outSpeed', 'speed', v => v.toFixed(2));
  bindSlider('rngGlow', 'outGlow', 'glow', v => v.toFixed(2));
  bindSlider('rngGravity', 'outGravity', 'gravity', v => v.toFixed(2));
  bindSlider('rngParticles', 'outParticles', 'particleTarget', v => String(v), syncParticleCount);

  /* =========================================================================
     POINTER, WHEEL & KEYBOARD INTERACTION
     ========================================================================= */
  function markInteracted() {
    if (!state.interacted) {
      state.interacted = true;
      hint.classList.add('hidden');
    }
  }

  stage.addEventListener('pointermove', e => {
    state.tx = e.clientX / width;
    state.ty = e.clientY / height;
  });

  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    markInteracted();
    state.tx = e.clientX / width;
    state.ty = e.clientY / height;
    state.pressing = true;
  });

  function releaseSingularity() {
    if (!state.pressing) return;
    const power = Math.max(0.25, state.pressCharge);
    state.pressing = false;
    state.shockwave = 1.0;
    state.shockX = state.mx;
    state.shockY = 1.0 - state.my;
    spawnShockwave(state.mx, state.my, power);
    audio.triggerChime(power);
  }
  window.addEventListener('pointerup', releaseSingularity);
  window.addEventListener('pointercancel', releaseSingularity);

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    markInteracted();
    state.targetZoom = Math.min(2.2, Math.max(0.65, state.targetZoom - e.deltaY * 0.00075));
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === '1') setWorld(0);
    else if (e.key === '2') setWorld(1);
    else if (e.key === '3') setWorld(2);
    else if (e.key === '4') setWorld(3);
    else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'h' || e.key === 'H') {
      const zen = document.body.classList.toggle('zen');
      if (!zen) showToast('Interface Restored');
    }
    else if (e.key === 'm' || e.key === 'M') audio.toggle();
    else if (e.key === 's' || e.key === 'S') captureSnapshot();
  });

  /* =========================================================================
     MAIN RENDER LOOP
     ========================================================================= */
  let lastTime = performance.now();
  let fpsAccum = 0, fpsFrames = 0;

  function lerp3(cur, target, k) {
    cur[0] += (target[0] - cur[0]) * k;
    cur[1] += (target[1] - cur[1]) * k;
    cur[2] += (target[2] - cur[2]) * k;
  }

  function renderParticlesAndFilaments(dt) {
    fxCtx.clearRect(0, 0, width, height);

    const mxPx = state.mx * width;
    const myPx = state.my * height;
    const grav = state.gravity;
    const pullRadius = 260 + state.pressCharge * 280;

    // Draw expanding shockwave rings
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.radius += (r.maxRadius - r.radius) * Math.min(1, dt * 4.2) + dt * 110;
      r.alpha -= dt * 1.15;
      if (r.alpha <= 0.01) {
        ripples.splice(i, 1);
        continue;
      }
      fxCtx.save();
      fxCtx.beginPath();
      fxCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      fxCtx.strokeStyle = r.color;
      fxCtx.globalAlpha = r.alpha * 0.55;
      fxCtx.lineWidth = 1.5 + r.alpha * 2.5;
      fxCtx.stroke();
      fxCtx.restore();
    }

    // Update & draw particles
    const nearCursor = [];
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (!state.paused) {
        if (p.isBurst) {
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.vx *= 0.968;
          p.vy *= 0.968;
          p.x += p.vx * (dt * 60);
          p.y += p.vy * (dt * 60);
        } else {
          // Gentle harmonic drift
          p.phase += dt * (0.8 + state.speed * 0.5);
          p.vx += Math.cos(p.phase + p.y * 0.004) * 0.012 * state.speed;
          p.vy += Math.sin(p.phase + p.x * 0.004) * 0.012 * state.speed;

          // Gravitational attraction + orbital swirl toward cursor
          const dx = mxPx - p.x;
          const dy = myPx - p.y;
          const dist = Math.hypot(dx, dy) + 1;
          if (dist < pullRadius) {
            const factor = (1 - dist / pullRadius) * grav;
            const pull = (0.065 + state.pressCharge * 0.42) * factor;
            const swirl = (0.055 + state.pressCharge * 0.24) * factor;
            p.vx += (dx / dist) * pull - (dy / dist) * swirl;
            p.vy += (dy / dist) * pull + (dx / dist) * swirl;
          }

          p.vx *= 0.975;
          p.vy *= 0.975;
          p.x += p.vx * (dt * 60) * (0.45 + state.speed * 0.55);
          p.y += p.vy * (dt * 60) * (0.45 + state.speed * 0.55);

          // Wrap edges softly
          if (p.x < -20) p.x = width + 20;
          else if (p.x > width + 20) p.x = -20;
          if (p.y < -20) p.y = height + 20;
          else if (p.y > height + 20) p.y = -20;
        }
      }

      const dCursor = Math.hypot(p.x - mxPx, p.y - myPx);
      if (!p.isBurst && dCursor < 185 && nearCursor.length < 48) {
        nearCursor.push(p);
      }

      const alpha = p.isBurst
        ? Math.max(0, (p.life / p.maxLife))
        : p.alpha * (0.65 + 0.35 * Math.sin(p.phase * 2.0));

      fxCtx.fillStyle = p.color;
      fxCtx.globalAlpha = Math.min(1, alpha * (0.8 + state.glow * 0.25));
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fxCtx.fill();
    }

    // Draw delicate luminous constellation filaments near cursor
    const accent = WORLDS[state.worldIndex].accent;
    fxCtx.strokeStyle = accent;
    fxCtx.lineWidth = 0.75;
    for (let i = 0; i < nearCursor.length; i++) {
      const a = nearCursor[i];
      for (let j = i + 1; j < nearCursor.length; j++) {
        const b = nearCursor[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 92) {
          fxCtx.globalAlpha = (1 - d / 92) * 0.28;
          fxCtx.beginPath();
          fxCtx.moveTo(a.x, a.y);
          fxCtx.lineTo(b.x, b.y);
          fxCtx.stroke();
        }
      }
    }
    fxCtx.globalAlpha = 1;
  }

  function renderFallback2D() {
    const ctx = glCanvas.getContext('2d');
    if (!ctx) return;
    const w = WORLDS[state.worldIndex];
    const grad = ctx.createRadialGradient(
      state.mx * glCanvas.width, state.my * glCanvas.height, 20,
      glCanvas.width * 0.5, glCanvas.height * 0.5, Math.max(glCanvas.width, glCanvas.height) * 0.8
    );
    grad.addColorStop(0, w.accent);
    grad.addColorStop(1, '#04050a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, glCanvas.width, glCanvas.height);
  }

  function frame(now) {
    requestAnimationFrame(frame);

    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    // FPS counter
    fpsAccum += dt;
    fpsFrames++;
    if (fpsAccum >= 0.4) {
      fpsVal.textContent = String(Math.round(fpsFrames / fpsAccum));
      fpsAccum = 0;
      fpsFrames = 0;
    }

    // Smooth pointer & zoom interpolation
    const ease = 1 - Math.exp(-dt * 9.5);
    state.mx += (state.tx - state.mx) * ease;
    state.my += (state.ty - state.my) * ease;
    state.zoom += (state.targetZoom - state.zoom) * (1 - Math.exp(-dt * 7.0));

    // Charge singularity while pressing
    if (state.pressing) {
      state.pressCharge = Math.min(1.0, state.pressCharge + dt * 1.15);
    } else {
      state.pressCharge = Math.max(0.0, state.pressCharge - dt * 2.8);
    }

    // Decay shockwave
    if (state.shockwave > 0) {
      state.shockwave = Math.max(0, state.shockwave - dt * 0.95);
    }

    // Smoothly morph palette toward active world
    const targetWorld = WORLDS[state.worldIndex];
    const colorEase = 1 - Math.exp(-dt * 3.2);
    lerp3(state.c1, targetWorld.c1, colorEase);
    lerp3(state.c2, targetWorld.c2, colorEase);
    lerp3(state.c3, targetWorld.c3, colorEase);
    lerp3(state.c4, targetWorld.c4, colorEase);

    if (!state.paused) {
      state.time += dt * state.speed;
    }

    audio.updateModulation(state.pressCharge, state.mx, state.my);

    // Render WebGL2 volumetric shader
    if (hasWebGL) {
      gl.useProgram(program);
      gl.uniform2f(uniforms.u_res, glCanvas.width, glCanvas.height);
      gl.uniform1f(uniforms.u_time, state.time);
      gl.uniform2f(uniforms.u_mouse, state.mx, 1.0 - state.my);
      gl.uniform1f(uniforms.u_charge, state.pressCharge);
      gl.uniform1f(uniforms.u_shock, state.shockwave);
      gl.uniform2f(uniforms.u_shockPos, state.shockX, state.shockY);
      gl.uniform1f(uniforms.u_glow, state.glow);
      gl.uniform1f(uniforms.u_zoom, state.zoom);
      gl.uniform1f(uniforms.u_mode, state.worldIndex);
      gl.uniform3fv(uniforms.u_c1, state.c1);
      gl.uniform3fv(uniforms.u_c2, state.c2);
      gl.uniform3fv(uniforms.u_c3, state.c3);
      gl.uniform3fv(uniforms.u_c4, state.c4);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    } else {
      renderFallback2D();
    }

    // Render luminous particles, ripples & constellations
    renderParticlesAndFilaments(dt);
  }

  requestAnimationFrame(frame);
})();
</script>

</html>
